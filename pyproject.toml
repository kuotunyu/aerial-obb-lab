[project]
name = "yolo26-dota-obb"
version = "0.1.0"
description = "YOLO26 Oriented Bounding Box detection on DOTA aerial imagery - training to deployment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "ultralytics==8.4.93",
    # torch pinned <2.9: 2.9+ needs MSVC redist >=14.50 which requires admin rights to
    # install on this Win10 box (WinError 1114, pytorch/pytorch#169429). Colab notebooks
    # don't use this file and run the latest torch.
    "torch>=2.6,<2.9",
    "torchvision",
    "huggingface_hub>=0.30",
    "shapely>=2.0",
    # ONNX export/inference (pre-installed so ultralytics doesn't shell out to pip inside the uv venv)
    "onnx>=1.16",
    "onnxslim",
    "onnxruntime>=1.20",
]

[dependency-groups]
demo = [
    "gradio>=5.0",
]
dev = [
    "jupytext>=1.19.4",
]

[tool.uv]
# PyTorch CUDA wheels for the local RTX 2070 (driver 551.23 -> CUDA 12.x wheels only, no cu13)
index = [
    { name = "pytorch-cu128", url = "https://download.pytorch.org/whl/cu128", explicit = true },
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obbkit"]
