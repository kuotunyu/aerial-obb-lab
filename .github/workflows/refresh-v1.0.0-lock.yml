name: Refresh v1.0.0 lock

on:
  push:
    branches: [release/v1.0.0]
    paths:
      - ".github/workflows/refresh-v1.0.0-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v1.0.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.11.18
      - name: Refresh lockfile
        run: uv lock
      - name: Verify frozen environment
        run: uv sync --frozen --no-install-project
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock already current"
            exit 0
          fi
          git commit -m "chore: refresh v1.0.0 lockfile"
          git push origin HEAD:release/v1.0.0
