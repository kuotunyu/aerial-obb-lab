name: Release gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-cpu:
    name: Core CPU / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked environment tool
        run: python -m pip install uv==0.11.18
      - name: Install default and development dependencies
        run: uv sync --frozen --no-install-project
      - name: Run unit and contract tests
        run: uv run --no-sync python -m pytest -q
      - name: Run repository gate
        run: uv run --no-sync python scripts/repo_check.py
      - name: Run release gate
        run: uv run --no-sync python scripts/release_check.py
      - name: Build wheel and source distribution
        run: uv build
      - name: Rebuild and verify committed snapshot
        run: uv run --no-sync python scripts/clean_export_check.py

  browser-smoke:
    name: Synthetic browser smoke / Ubuntu CPU
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked environment tool
        run: python -m pip install uv==0.11.18
      - name: Install default and development dependencies
        run: uv sync --frozen --no-install-project
      - name: Install headless Chromium
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Exercise the static UI with a synthetic fixture and stubbed output
        run: uv run --no-sync python scripts/browser_smoke.py
